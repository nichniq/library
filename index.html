<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nick's Library</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <header>
    <div class="title-row">
      <h1>Nick's Library</h1>
      <details id="stats-wrap" class="stats-toggle">
        <summary>Stats</summary>
      </details>
      <a class="header-nav" href="./entry.html">+ New entry →</a>
    </div>
    <dl class="stats" id="stats" hidden></dl>
  </header>

  <nav class="controls" aria-label="Filter and view options">
    <search role="search">
      <label>
        <span class="visually-hidden">Search</span>
        <input
          id="search"
          type="search"
          placeholder="Search title, subtitle, series, location, notes…"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
    </search>

    <details class="facet">
      <summary>Acquisition <span class="facet-count" id="type-count"></span></summary>
      <fieldset id="type-filters"></fieldset>
    </details>

    <details class="facet">
      <summary>Location <span class="facet-count" id="loc-count"></span></summary>
      <fieldset id="loc-filters"></fieldset>
    </details>

    <details class="facet">
      <summary>Group by</summary>
      <fieldset id="group-by">
        <label><input type="radio" name="group" value="none" checked /> None</label>
        <label><input type="radio" name="group" value="year" /> Year</label>
        <label><input type="radio" name="group" value="location" /> Location</label>
        <label><input type="radio" name="group" value="type" /> Acquisition type</label>
      </fieldset>
    </details>

    <details class="facet">
      <summary>Sort</summary>
      <fieldset id="sort-by">
        <label><input type="radio" name="sort" value="auto" checked /> File order</label>
        <label><input type="radio" name="sort" value="acquired" /> Acquisition date</label>
        <label><input type="radio" name="sort" value="alpha" /> Alphabetical</label>
      </fieldset>
    </details>

    <button id="reset" class="reset" type="button">Reset</button>
  </nav>

  <p class="result-count" id="result-count" aria-live="polite"></p>

  <nav class="group-index" id="group-index" aria-label="Jump to group" hidden></nav>

  <main id="results"></main>

  <template id="book-row">
    <details class="book">
      <summary>
        <span class="title"></span>
        <span class="subtitle"></span>
        <span class="meta">
          <span class="acquired-date"></span>
          <span class="acquired-where"></span>
        </span>
      </summary>
      <div class="book-body">
        <dl class="book-fields"></dl>
        <section class="transactions">
          <h3>Acquisition history</h3>
          <ol class="transaction-list"></ol>
        </section>
      </div>
    </details>
  </template>

  <script type="module" src="catalog.js"></script>
</body>
</html>
